[package]
name = "potential_doodle"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19.0"

# Faster iterative builds: light optimization for our code, full for dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Smaller wasm binary for web releases.
[profile.release]
opt-level = "s"
lto = "thin"

[package]
name = "potential_doodle"
version = "0.1.0"
edition = "2024"

[dependencies]
# Bevy's 2d and ui feature bundles (text, animation, picking included);
# drops the default 3d and audio stacks.
# "webgpu" overrides the bundled webgl2 backend on wasm: modern limits and
# compute support, but requires a WebGPU-capable browser (no fallback).
bevy = { version = "0.19.0", default-features = false, features = ["2d", "ui", "webgpu"] }
resvg = { version = "0.47.0", default-features = false }

# Faster iterative builds: light optimization for our code, full for dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Smaller wasm binary for web releases.
[profile.release]
opt-level = "s"
lto = "thin"
